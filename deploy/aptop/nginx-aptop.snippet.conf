# Snippet for https://aptop.tangentcode.com
# Include from the server{} that terminates TLS for this host.
#
# Netty: proxy_pass with a trailing slash STRIPS the /netty/ prefix so the
# Node server still sees / and /api. The browser client resolves api relative
# to the page URL and therefore POSTs to /netty/api.
#
# Interp: static UI under deploy/aptop/site/interp/; API only is proxied.
# Browser POSTs to /interp/api/run → strip /interp/api/ → Node sees /run.

location /netty/ {
  proxy_pass http://127.0.0.1:4711/;  # strip prefix
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /interp/api/ {
  proxy_pass http://127.0.0.1:4712/;  # strip /interp/api/
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
  root /home/michal/ver/laptop/deploy/aptop/site;
  try_files $uri $uri/ /index.html;
}
