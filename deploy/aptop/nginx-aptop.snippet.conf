# Snippet for https://aptop.tangentcode.com
# Include from the server{} that terminates TLS for this host.
#
# Ampheck: proxy_pass with a trailing slash STRIPS the /ampheck/ prefix so the
# Node server still sees / and /api. The browser client resolves api relative
# to the page URL and therefore POSTs to /ampheck/api.

location /ampheck/ {
  proxy_pass http://127.0.0.1:4711/;  # strip prefix
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Old /netty/ URLs (the tool was renamed Netty -> Ampheck). Page and asset
# URLs get a permanent 301; the API gets a 308 so a POST stays a POST.
location = /netty {
  return 301 /ampheck/;
}
location ^~ /netty/api {
  return 308 /ampheck/api$is_args$args;
}
location ^~ /netty/ {
  rewrite ^/netty/(.*)$ /ampheck/$1 permanent;
}

# Optional later: interp runner on loopback :4712
# location /interp/api/ {
#   proxy_pass http://127.0.0.1:4712/;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
# }

location / {
  root /home/michal/ver/laptop/deploy/aptop/site;
  try_files $uri $uri/ /index.html;
}
